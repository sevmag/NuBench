[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nubench"
version = "0.1.0"
description = "Evaluation metrics and plotting tools for the NuBench neutrino telescope reconstruction benchmark."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib>=3.5",
    "scikit-learn",
    "scipy",
    "pyarrow",
]

[project.optional-dependencies]
develop = [
    "pytest",
    "flake8",
    "mypy",
]

[project.scripts]
nubench-plot = "nubench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
ignore_missing_imports = true
